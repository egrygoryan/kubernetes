# Storage class for efs volumes
# this file is a reference how sc should look like.
# now 
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  provisioningMode: efs-ap
  fileSystemId: *fs-somevalue*
  directoryPerms: "700"
  gidRangeStart: "1000" 
  gidRangeEnd: "2000" 
  basePath: "/eks_project" 
  subPathPattern: "${.PVC.namespace}/${.PVC.name}" 
  ensureUniqueDirectory: "false"
  reuseAccessPoint: "false" 
  enableTagging: "true" 