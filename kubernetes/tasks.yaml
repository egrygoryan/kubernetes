apiVersion: v1
kind: Service
metadata:
  name: tasks-service
spec:
  selector:
    app: tasks
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks
  template:
    metadata:
      labels:
        app: tasks
    spec:
      containers:
        - name: tasks-api
          image: ehryhorian/eks-tasks-api:1.0
          env:
            - name: MONGO_USER
              value: 'edward'
            - name: MONGO_PASS
              value: 'password'
            - name: MONGO_DB_ADDRESS
              value: 'db-service.default:27017'
            - name: AUTH_API_ADDRESS
              value: 'auth-service.default:3000'
