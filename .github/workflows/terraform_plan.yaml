name: Terraform plan on pull requests
on:
    pull_request:
        branches: [main]
        paths: ['terraform/**']
env:
  TF_VERSION: "1.15.8"
  AWS_REGION: "eu-north-1"
permissions:
  id-token: write # allows the workflow to request (fetch) and use (set) an OIDC token for an action or step.
  contents: read # allows the runner to read content of repo
  pull-requests: write # allows to create or update comments on prs
jobs:
    plan:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./terraform
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-region: ${{ env.AWS_REGION }}
                role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
                role-session-name: ${{ github.run_id }} # will show which AWS actions were performed by which workflow run.

            - name: Setup terraform CLI
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: ${{ env.TF_VERSION }}
              
            - name: Terraform format
              run: terraform fmt -recursive -check -no-color # recursive is here for convenience, mb in the next iterations nested folders will be added
            
            - name: Terraform init
              run: terraform init -input=false -no-color

            - name: Terraform validate
              run: terraform validate 

            - name: Terraform plan
              id: plan
              run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan

            - name: Add plan to the job summary
              run: |
               {
                 echo '### Terraform plan'
                 echo '```'
                 terraform show -no-color tfplan | head -c 60000
                 echo '```'
               } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/github-script@v7
              if: github.event_name == 'pull_request'
              env:
                PLAN: "${{ steps.plan.outputs.stdout }}"
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                script: |
                  const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                  })
                  const botComment = comments.find(comment => {
                    return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
                  })

                  const output = `#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
                  <details><summary>Show Plan</summary>
            
                  \`\`\`
                  ${process.env.PLAN}
                  \`\`\`
            
                  </details>`;
                        
                  if (botComment) {
                    github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: botComment.id,
                      body: output
                    })
                  } else {
                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: output
                    })
                  }